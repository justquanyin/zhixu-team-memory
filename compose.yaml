services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: memory
      POSTGRES_USER: memory
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your shell}
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - memory-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memory"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  memory-db:
